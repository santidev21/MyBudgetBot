# Gitleaks configuration for MyBudget-bot.
#
# Extends the default ruleset with an allowlist for files that only ever contain
# intentionally-fake or test-only credentials (CI placeholders, example env files
# and test fixtures). Everything else is scanned, including git history.

[extend]
useDefault = true

[allowlist]
description = "Known non-secret and test-only files"
paths = [
  '''\.github/workflows/.*\.ya?ml$''',
  '''\.env\.example$''',
  '''.*/tests/.*''',
  '''.*\.Tests?\.cs$''',
]
