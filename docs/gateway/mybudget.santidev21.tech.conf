# ── MyBudget-bot — mybudget.santidev21.tech ────────────────────────────────────
#
# TEMPLATE. Copy it to vps-gateway/sites-enabled/mybudget.santidev21.tech.conf on the
# VPS only AFTER the certificate exists, or `nginx -t` fails. See
# vps-gateway/AGENTS.md ("How to Add a New Project") for the procedure and
# README.md in this repository for the deployment sequence.
#
# Why this file is part of this repository: the health endpoints and the webhook are
# the only things this service exposes, and their exposure is decided here, not in
# application code. Having the config versioned next to the app keeps that decision
# reviewable instead of improvised on the server.

# HTTP: ACME challenge + redirect to HTTPS.
server {
    listen 8080;
    server_name mybudget.santidev21.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS.
server {
    listen 8443 ssl;
    http2 on;
    server_name mybudget.santidev21.tech;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mybudget.santidev21.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybudget.santidev21.tech/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Re-resolved by the Docker embedded DNS (resolver in nginx.conf), so a redeploy
    # that changes the container IP is picked up without reloading nginx.
    set $app_upstream mybudget:8080;

    # Telegram sends small JSON bodies.
    client_max_body_size 1m;

    # ------------------------------------------------------------------
    # Telegram webhook. The only path Telegram needs.
    #   * POST only
    #   * generous burst: Telegram retries and can deliver in bursts
    #   * access_log off: the path contains a secret segment and the body
    #     contains the user's own message text
    # The secret token header is forwarded untouched; the application
    # validates it in constant time.
    # ------------------------------------------------------------------
    location ^~ /telegram/webhook {
        limit_except POST {
            deny all;
        }

        access_log off;
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Liveness only. Safe to expose: it reports nothing but that the
    # process is up, and it deliberately does not touch the database.
    # ------------------------------------------------------------------
    location = /health/live {
        limit_req zone=general burst=20 nodelay;
        access_log off;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------------------
    # Readiness and the detailed report expose internals (dependency
    # status, timings). Docker bridge ranges are private, so this is a
    # fail-closed default: everything else is denied.
    # ------------------------------------------------------------------
    location ^~ /health {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://$app_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # The bot has no web UI. Anything else is not a route.
    location / {
        return 404;
    }
}
