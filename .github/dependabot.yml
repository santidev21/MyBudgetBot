# Dependabot configuration for MyBudget-bot.
# Keeps NuGet, GitHub Actions and the Docker base image up to date and surfaces
# known vulnerabilities as security alerts/PRs.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "weekly"
